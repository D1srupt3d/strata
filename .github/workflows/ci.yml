name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (tags are mutable); the trailing
# comment is the version, which Renovate keeps in sync when it bumps a pin.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
