name: ci

# Only changes that can break the build or tests run CI: Go code plus the
# non-Go files the tests read. A docs-only change (README, ROADMAP) skips it.
# Safe because main has no required status checks; requiring this job would
# leave docs-only PRs waiting forever. Releases still test every tag.
on:
  push:
    branches: [main]
    paths: # keep in sync with pull_request below
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'internal/release/release_key.pub' # embedded in the binary
      - 'internal/release/testdata/**'     # signature fixtures
      - 'get.sh'                           # run by getsh_test.go
      - '.gitattributes'                   # keeps fixtures byte-exact on Windows
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'internal/release/release_key.pub' # embedded in the binary
      - 'internal/release/testdata/**'     # signature fixtures
      - 'get.sh'                           # run by getsh_test.go
      - '.gitattributes'                   # keeps fixtures byte-exact on Windows
      - '.github/workflows/ci.yml'

permissions:
  contents: read

# Actions are pinned to full commit SHAs (tags are mutable); the trailing
# comment is the version, which Renovate keeps in sync when it bumps a pin.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      # Linters are pinned to exact versions, like the actions above, so a
      # new release can't change what passes without a commit saying so.
      # Both run on every OS: they only analyze code built for the OS they
      # run on, so a Linux-only run never checks lock_windows.go or the
      # Windows paths through the standard library. (gofmt is the same on
      # every OS, so Linux alone is enough for it.) govulncheck fails when a
      # known vulnerability reaches code strata actually calls - in a
      # dependency, or in the standard library of the Go version in go.mod.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
