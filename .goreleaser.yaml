version: 2

# Tags must be un-padded CalVer (v2026.8.0, not v2026.08.0) - GoReleaser
# enforces semver and rejects the zero-padded month.

builds:
  - binary: strata
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      # channel=release marks official builds; only these `strata upgrade`
      # themselves (source builds default to "source" - see main.go).
      - -s -w -X main.version={{.Version}} -X main.channel=release

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Sign checksums.txt with the strata release key (an SSH key), producing
# checksums.txt.sig. release.yml writes the key to STRATA_RELEASE_KEY_FILE
# from the `release` environment. `strata upgrade` and get.sh verify this
# signature against the public key in internal/release/release_key.pub,
# under the strata-release namespace, and refuse any release where it fails.
signs:
  - artifacts: checksum
    cmd: ssh-keygen
    args: ["-Y", "sign", "-n", "strata-release", "-f", "{{ .Env.STRATA_RELEASE_KEY_FILE }}", "${artifact}"]
    signature: "${artifact}.sig"

# Homebrew: publish a cask (GoReleaser deprecated formulas for prebuilt
# binaries) to the D1srupt3d/homebrew-strata tap on every release. The token
# is HOMEBREW_TAP_TOKEN in the `release` environment, a fine-grained token
# that can write to that one repo and nothing else. `strata upgrade` and
# `strata uninstall` step aside for Homebrew installs (isHomebrewPath).
homebrew_casks:
  - repository:
      owner: D1srupt3d
      name: homebrew-strata
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/D1srupt3d/strata
    description: Dotfiles manager with layers instead of templates
    skip_upload: auto # never publish a prerelease to the tap
    # strata isn't notarized by Apple, so Gatekeeper would refuse a
    # quarantined download. The cask pins each archive's SHA-256 from
    # checksums.txt, which is what we trust instead.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/strata"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
